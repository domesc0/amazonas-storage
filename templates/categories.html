<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Categories - AMAZONAS STORAGE</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; margin: 0; padding: 12px; }
        @media(min-width: 768px) { body { padding: 20px; } }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00adb5; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 1.5rem; }
        a { color: #00adb5; text-decoration: none; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #333; }
        .cat-tree { margin-top: 15px; }
        .main-cat { background: #252525; padding: 10px; margin: 10px 0; border-radius: 6px; }
        .sub-cat { margin-left: 15px; padding: 5px; border-left: 2px solid #00adb5; display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        input, select, button { background: #252525; color: #eee; border: 1px solid #444; padding: 10px; border-radius: 4px; font-size: 0.95rem; }
        form.add-cat-form { display: flex; flex-direction: column; gap: 8px; }
        @media(min-width: 600px) {
            form.add-cat-form { flex-direction: row; }
            input, select { flex: 1; }
        }
        .btn-danger { background: #ff2e63; color: white; border: none; cursor: pointer; padding: 6px 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>Category Manager</h1>
        <a href="/">« Back to Home</a>
    </header>

    <div class="box">
        <h3>Add New Category</h3>
        <form method="post" action="/add-category" class="add-cat-form">
            <input type="text" name="name" placeholder="Category Name *" required>
            <select name="parent_id">
                <option value="">-- Main Category (leave empty for root) --</option>
                {% for m in mains %}
                    <option value="{{ m.id }}">{{ m.name }}</option>
                {% endfor %}
            </select>
            <button type="submit" style="background: #00adb5; color: #121212; font-weight: bold; min-height: 40px;">Create Category</button>
        </form>
    </div>

    <div class="box cat-tree">
        <h3>Category Tree</h3>
        {% for cat in category_tree %}
            <div class="main-cat">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong style="color: #00adb5; font-size: 1.1em;">{{ cat.name }}</strong>
                    <form method="post" action="/delete-category/{{ cat.id }}" style="display:inline;">
                        <button type="submit" class="btn-danger" onclick="return confirm('Delete this main category?')">Delete</button>
                    </form>
                </div>

                {% for sub in cat.subs %}
                    <div class="sub-cat">
                        <span>└─ {{ sub.name }} <small style="color: #888;">({{ sub.item_count }} items)</small></span>
                        <form method="post" action="/delete-category/{{ sub.id }}" style="display:inline;">
                            <button type="submit" class="btn-danger" onclick="return confirm('Delete this subcategory?')">Delete</button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</body>
</html>
